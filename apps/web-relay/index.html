<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Relais</title>
    <style>
      /* Marque : crème, encre, brun, doré. Sombre si le navigateur le demande ; rien n'est écrit. */
      :root { color-scheme: light; --bg: #faf8f5; --ink: #2a1f12; --muted: #7a6a55; --brand: #8b5c2a; --on-brand: #faf8f5; --danger: #b00020; --field: #f1ebe2; }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --bg: #1f1a15; --ink: #f3ede4; --muted: #b8a993; --brand: #d9b07c; --on-brand: #1f1a15; --danger: #ff8a80; --field: #2e2620; }
      }
      body { margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: var(--bg); }
      main { max-width: 560px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; }
      h1 { font-size: 26px; margin: 0 0 4px; }
      h2 { font-size: 18px; margin: 12px 0 0; }
      p { margin: 0; font-size: 16px; line-height: 22px; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
      input { background: var(--field); border: 0; border-radius: 8px; padding: 10px 12px; font-size: 16px; color: var(--ink); }
      button { margin-top: 8px; padding: 12px 18px; border-radius: 8px; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); font-weight: 600; font-size: 16px; cursor: pointer; }
      button.secondary { background: transparent; color: var(--brand); }
      button:disabled { opacity: 0.5; cursor: default; }
      .error { color: var(--danger); font-size: 15px; }
      .item { padding: 10px; border: 1px solid var(--field); border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
      .item.done { opacity: 0.55; }
      .item strong { font-size: 16px; }
      .muted { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <main id="app"><p>…</p></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
